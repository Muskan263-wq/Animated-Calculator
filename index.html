<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator">
  <span class="screw tl"></span>
  <span class="screw tr"></span>
  <span class="screw bl"></span>
  <span class="screw br"></span>

  <p class="brand">Model CD‑01</p>

  <div class="lcd-bezel">
    <div class="lcd">
      <div class="expression" id="expression"></div>
      <div class="display" id="display">0</div>
    </div>
  </div>

  <div class="keys">
    <button class="btn-clear" data-action="clear">C</button>
    <button class="btn-back" data-action="backspace">⌫</button>
    <button class="btn-op" data-op="÷">÷</button>
    <button class="btn-op" data-op="×">×</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="btn-op" data-op="−">−</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="btn-op" data-op="+">+</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="btn-equals" data-action="equals" style="grid-row: span 2;">=</button>

    <button class="btn-zero" data-num="0">0</button>
    <button data-num=".">.</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
